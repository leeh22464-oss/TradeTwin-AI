<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TradeTwin 询盘助手</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header>
  <strong>贸链通 TradeTwin</strong>
  <span id="conn" class="pill">连接中…</span>
</header>

<section>
  <div class="row">
    <button id="btn-read" class="btn">读取选中的买家消息</button>
    <select id="channel">
      <option value="alibaba_rfq">国际站 RFQ</option>
      <option value="email">邮件</option>
    </select>
    <button id="btn-new" class="btn" title="换了一个买家时点这里">新会话</button>
  </div>
  <p class="hint">在国际站对话里选中买家的消息再点读取；也可以直接粘贴。同一个买家的后续消息会自动接上一轮。</p>
  <textarea id="input" rows="6" placeholder="买家消息会出现在这里，也可以直接粘贴"></textarea>
  <button id="btn-analyze" class="btn primary wide">分析并生成回复</button>
</section>

<section id="summary" class="hidden"></section>

<section id="reply" class="hidden">
  <div class="tabs" id="lang-tabs"></div>
  <textarea id="reply-body" rows="12"></textarea>
  <div class="row">
    <button id="btn-insert" class="btn primary">填入回复框</button>
    <button id="btn-copy" class="btn">复制</button>
    <button id="btn-check" class="btn">校验此文本</button>
  </div>
  <button id="btn-review-mine" class="btn wide">我写 AI 审：读取我在回复框里写的内容</button>
  <div id="check"></div>
  <div class="r2">
    <input id="instruction" placeholder="修改指令：选方案C / 先不要承诺交期 / 只要德语">
    <button id="btn-instruct" class="btn">改</button>
  </div>
  <p class="hint">只会填入输入框，发送需要你自己点击。</p>
</section>

<details>
  <summary>设置</summary>
  <label>后端地址 <input id="backend" value="http://127.0.0.1:8000"></label>
</details>

<div id="toast" class="toast hidden"></div>
<script src="sidepanel.js"></script>
</body>
</html>
