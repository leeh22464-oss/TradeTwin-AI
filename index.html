<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f3" />
    <title>贸链通 TradeTwin AI</title>
    <script>
      try {
        const theme = localStorage.getItem('tradetwin-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#111715' : '#f5f6f3';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="dialog-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
